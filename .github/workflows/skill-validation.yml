name: Skill Validation

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      VITE_BUILD_GIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting with oxfmt
        run: pnpm exec oxfmt --check

      - name: Validate Skills and Apps
        run: pnpm validate-packages

      - name: Test package contracts
        run: pnpm test

      - name: Install Lua for App contract tests
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Test App Lua APIs and cleanup
        run: lua5.4 tests/apps.lua

      - name: Try Build
        run: pnpm build
